<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32" fill="none">
  <defs>
    <!-- Gradiente Cian a Azul Eléctrico -->
    <linearGradient id="luxprocGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#0052d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Isotipo Geométrico -->
  <g filter="url(#glow)">
    <!-- Rombo Superior Iluminado -->
    <polygon points="32,8 52,20 32,32 12,20" fill="url(#luxprocGlow)" opacity="0.95" />
    <!-- Cara Lateral Izquierda -->
    <polygon points="12,20 32,32 32,46 12,34" fill="#0066eb" />
    <!-- Cara Lateral Derecha con Brillo Cian -->
    <polygon points="32,32 52,20 52,34 32,46" fill="#00d2ff" />
    <!-- Base e Intersección Central -->
    <polygon points="32,36 46,44 32,54 18,44" fill="#003bb5" />
    <polygon points="32,38 42,44 32,50 22,44" fill="#00f0ff" opacity="0.8" />
  </g>
</svg>
