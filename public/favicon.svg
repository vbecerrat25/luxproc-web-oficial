<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="luxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="luxGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark tech backdrop circle for high contrast in all browser themes -->
  <rect width="100" height="100" rx="24" fill="#0B0F19" />
  <circle cx="50" cy="50" r="44" stroke="url(#luxGrad)" stroke-width="1.5" fill="none" opacity="0.3" />

  <!-- Outer tech nodes / Hexagon -->
  <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" 
           stroke="url(#luxGrad)" 
           stroke-width="3" 
           fill="none" 
           stroke-linejoin="round" />

  <!-- Circuit nodes -->
  <circle cx="50" cy="15" r="3.5" fill="#38BDF8" />
  <circle cx="80" cy="32" r="3.5" fill="#60A5FA" />
  <circle cx="80" cy="68" r="3.5" fill="#818CF8" />
  <circle cx="50" cy="85" r="3.5" fill="#A855F7" />
  <circle cx="20" cy="68" r="3.5" fill="#3B82F6" />
  <circle cx="20" cy="32" r="3.5" fill="#06B6D4" />

  <!-- Internal dynamic cloud / processing flow -->
  <path d="M38 58 C32 58 28 53 28 47 C28 41 33 37 38 37 C40 31 47 27 54 27 C62 27 68 32 70 38 C75 38 78 42 78 47 C78 53 74 58 68 58 Z" 
        fill="url(#luxGrad)" 
        opacity="0.9" />

  <!-- Core processor symbol / Infinity spark -->
  <path d="M42 48 Q 50 40, 58 48 Q 50 56, 42 48" 
        stroke="#FFFFFF" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        fill="none" 
        filter="url(#glow)" />
  <circle cx="50" cy="48" r="2.5" fill="#FFFFFF" />
</svg>
